# Render Blueprint: QueryWise runs as ONE service. Express (API + React UI) and the Python generation
# service share a container, so a visitor's browser wakes both together, and Express reaches the Python
# service over localhost instead of calling a second, separately sleeping service.
# Values marked "sync: false" are secrets: Render asks for them, so they never appear in this file or in git.
services:
  - type: web
    name: querywise
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/live
    envVars:
      - key: POSTGRES_DB
        value: pagila
      - key: DB_SSLMODE
        value: require             # Python: Neon accepts only encrypted connections
      - key: DB_SSL
        value: "true"              # Express: the same, with certificate verification
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: DAILY_TOKEN_BUDGET
        value: "100000"            # half the daily Groq allowance: the public demo can never use it all
      - key: TRUST_PROXY
        value: "1"                 # visitors arrive through Render's front server; lets rate limits see real visitors
      - key: INTERNAL_API_TOKEN
        generateValue: true        # shared secret between Express and the Python service (defence in depth)
      - key: JWT_SECRET
        generateValue: true        # random signing key for login tokens
      - key: DB_HOST
        sync: false
      - key: READER_PASSWORD
        sync: false
      - key: APP_USER_PASSWORD
        sync: false
      - key: API_USER_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false